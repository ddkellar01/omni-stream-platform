apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: omnistream
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: omnistream/api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: ORCHESTRATOR_URL
          value: "http://promotion-orchestrator.omnistream.svc.cluster.local:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: omnistream
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
