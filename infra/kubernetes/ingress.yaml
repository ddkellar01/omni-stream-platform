apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnistream-ingress
  namespace: omnistream
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.omnistream.io
    secretName: omnistream-tls-cert
  rules:
  - host: api.omnistream.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 80
